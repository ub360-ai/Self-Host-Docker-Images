# Internal Harbor router (plain HTTP on :8080).
#
# Production (Coolify): Traefik terminates TLS and proxies to this service.
#   Set the domain on harbor-router:  https://registry.example.com:8080
# Local: docker-compose.override.yml publishes it on 127.0.0.1:8080.
#
# Routing (same paths Harbor expects behind its own proxy):
#   /                          -> harbor-portal:8080 (web UI)
#   /api/ /c/ /service/ /v2/   -> harbor-core:8080   (API, login, token, registry)
#
# Keep the upstream scheme when a TLS-terminating proxy is in front; fall
# back to the local scheme for direct local access.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Preserve the original client address if an upstream proxy already set it.
map $http_x_real_ip $client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    # Registry pushes can be arbitrarily large
    client_max_body_size 0;

    proxy_http_version 1.1;
    # $http_host (not $host) keeps the port locally and the public domain in
    # production, so Harbor advertises the correct token realm.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    location / {
        proxy_pass http://harbor-portal:8080;
    }

    location /api/ {
        proxy_pass http://harbor-core:8080;
    }

    location /c/ {
        proxy_pass http://harbor-core:8080;
    }

    location /service/ {
        proxy_pass http://harbor-core:8080;
    }

    location /v2/ {
        proxy_pass http://harbor-core:8080;
        # Stream blobs instead of buffering them
        proxy_request_buffering off;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }
}
